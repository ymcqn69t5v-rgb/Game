name: Bootstrap Nimbus HQ

on:
  push:
    branches: [production/nimbus-hq]

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: production/nimbus-hq
          fetch-depth: 0
      - name: Wait for complete payload
        id: payload
        shell: bash
        run: |
          if [ -f payload/READY ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install production source
        if: steps.payload.outputs.ready == 'true'
        shell: bash
        run: |
          cat payload/part-* | base64 --decode > /tmp/nimbus-hq.tar.gz
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name payload ! -name .github -exec rm -rf {} +
          tar -xzf /tmp/nimbus-hq.tar.gz -C .
          rm -rf payload
          rm -f .github/workflows/bootstrap-nimbus.yml
          git config user.name "Nimbus HQ automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "feat: complete Nimbus HQ production app"
          git push origin HEAD:production/nimbus-hq
